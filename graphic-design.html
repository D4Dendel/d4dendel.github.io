<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Dyndel Pino</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261004.d">
</head>
<body class="shop-page">
    <header class="header">
        <div class="nav-container">
            <div class="logo-wrap">
                <img src="img/icon.png" alt="Dyndel Pino logo">
                <div class="brand">Dyndel <span>Pino</span></div>
            </div>
            <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <nav class="nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="illustration.html">Illustration</a></li>
                    <li><a href="portraits.html">Portraits</a></li>
                    <li><a href="logos.html">Logos</a></li>
                    <li><a href="graphic-design.html">Shop</a></li>
                    <li><a href="stories.php">Stories</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-shell category-page">
        <section class="category-hero shop-hero">
            <p class="eyebrow">Small edition shop</p>
            <h1>Artwork made to leave the screen.</h1>
            <p>Browse signed prints and studio pieces, then build your order in the cart.</p>
        </section>

        <section class="shop-layout" aria-label="Shop catalog">
            <div class="shop-grid" data-shop-products></div>
            <aside class="shop-cart-column" aria-label="Shopping cart">
                <button class="btn btn-primary shop-cart-button" type="button" data-open-cart>Cart <span data-cart-count>0</span></button>
                <div class="shop-cart" data-cart-panel hidden>
                <div class="shop-cart-header"><h2>Your cart</h2><button class="icon-button" type="button" data-close-cart aria-label="Close cart">&times;</button></div>
                <div data-cart-items></div>
                <div class="shop-cart-total"><span>Total</span><strong data-cart-total>$0.00</strong></div>
                <form class="shop-checkout-form" data-checkout-form>
                    <h3>Checkout</h3>
                    <label><span>Name</span><input name="customerName" required></label>
                    <label><span>Email</span><input type="email" name="customerEmail" required></label>
                    <label><span>Shipping address</span><textarea name="customerAddress" rows="3" required></textarea></label>
                    <p class="shop-form-message" data-checkout-message role="status"></p>
                    <button class="btn btn-primary" type="submit">Place order</button>
                </form>
                </div>
            </aside>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Dyndel Pino</p>
    </footer>

    <script src="script.js?v=20261004.d"></script>
</body>
</html>
