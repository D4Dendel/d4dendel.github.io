<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Dyndel Pino</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20261005.nav2">
</head>
<body class="shop-page">
    <header class="header">
    <div class="nav-container">
        <div class="logo-wrap">
            <img src="img/icon.png" alt="Dyndel Pino logo">
            <div class="brand">Dyndel <span>Pino</span></div>
        </div>
        <nav class="nav" aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="index.html" data-nav-section="home">Home</a></li>
                <li class="nav-works">
                    <button class="nav-works-toggle" type="button" data-works-toggle aria-expanded="false" aria-controls="works-menu">Works <span class="nav-caret" aria-hidden="true">&#9662;</span></button>
                    <ul class="nav-submenu" id="works-menu">
                        <li><a href="illustration.html" data-works-section="illustration">Illustration</a></li>
                        <li><a href="portraits.html" data-works-section="portraits">Portraits</a></li>
                        <li><a href="logos.html" data-works-section="logos">Logos</a></li>
                    </ul>
                </li>
                <li><a href="stories.php" data-nav-section="stories">Stories</a></li>
                <li><a href="index.html#contact" data-nav-section="contact">Contact</a></li>
                <li><a href="store.html" data-nav-section="store">Store</a></li>
            </ul>
        </nav>
        <div class="header-cart-slot">
            <button class="shop-header-cart" type="button" data-open-cart aria-expanded="false" aria-hidden="true" tabindex="-1">Cart <span class="shop-header-cart-count" data-cart-count hidden>0</span></button>
        </div>
        <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

    <section class="shop-banner" aria-labelledby="shop-title">
        <div class="shop-banner-copy">
            <p class="eyebrow">Dyndel artist shop</p>
            <h1 id="shop-title">Art for your everyday.</h1>
        </div>
        <div class="shop-banner-art" data-shop-banner-art aria-hidden="true"></div>
    </section>

    <main class="page-shell category-page">
        <section class="shop-layout" aria-label="Shop catalog">
            <aside class="shop-cart-column" data-cart-region aria-label="Shopping cart" hidden>
                <div class="shop-cart" id="shop-cart-panel" data-cart-panel hidden>
                <div class="shop-cart-header"><h2>Your cart</h2><button class="icon-button" type="button" data-close-cart aria-label="Close cart">&times;</button></div>
                <div data-cart-items></div>
                <div class="shop-cart-total"><span>Total</span><strong data-cart-total>$0.00</strong></div>
                <form class="shop-checkout-form" data-checkout-form>
                    <h3>Checkout</h3>
                    <label><span>Name</span><input name="customerName" required></label>
                    <label><span>Email</span><input type="email" name="customerEmail" required></label>
                    <label><span>Shipping address</span><textarea name="customerAddress" rows="3" required></textarea></label>
                    <p class="shop-form-message" data-checkout-message role="status"></p>
                    <button class="btn btn-primary" type="submit">Place order</button>
                </form>
                </div>
            </aside>
            <div class="shop-catalog" data-shop-products aria-live="polite"></div>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 Dyndel Pino</p>
    </footer>

    <script src="script.js?v=20261005.nav2"></script>
</body>
</html>
